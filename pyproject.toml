[project]
name = "ankihelper"
version = "0.1.0"
description = "Dictate Anki cards while you study, let an AI agent clean them up, import them with AnkiConnect."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "pygments>=2.17",
    "platformdirs>=4.0",
    "filelock>=3.12",
]

[project.scripts]
ankihelper = "ankihelper.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ankihelper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
